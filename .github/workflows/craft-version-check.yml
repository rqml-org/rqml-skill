name: Reference version check

# The sync (sync-craft.yml) and the plugins' drift guards key off the
# "<!-- canonical-version: N -->" stamp in each canonical reference, but bumping it
# is otherwise only a documented convention. This guard fails any PR that changes a
# reference (references/authoring.md or references/monorepo.md) without increasing
# its stamp, so the version the sync/guards depend on can never silently go stale
# (REQ-CRAFT-SYNC).

on:
  pull_request:
    paths: ['references/authoring.md', 'references/monorepo.md']

permissions:
  contents: read

jobs:
  version-bumped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a canonical-version increment on changed references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ver() { git show "$1:references/$2" 2>/dev/null | grep -oE 'canonical-version: [0-9]+' | head -1 | grep -oE '[0-9]+'; }
          rc=0
          for f in authoring.md monorepo.md; do
            if git diff --quiet "$BASE_SHA" HEAD -- "references/$f"; then
              continue   # unchanged in this PR
            fi
            new="$(ver HEAD "$f" || true)"
            old="$(ver "$BASE_SHA" "$f" || true)"
            echo "references/$f: ${old:-<new file>} -> ${new:-<none>}"
            if [ -z "$new" ]; then
              echo "::error file=references/$f::missing a canonical-version stamp"; rc=1; continue
            fi
            if [ -n "$old" ] && [ "$new" -le "$old" ]; then
              echo "::error file=references/$f::changed but canonical-version did not increase (${old} -> ${new}). Bump the stamp."; rc=1
            fi
          done
          exit $rc
