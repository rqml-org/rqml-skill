name: Sync RQML reference docs to plugins

# Propagates the canonical RQML reference docs — references/authoring.md (authoring
# craft) and references/monorepo.md (monorepo spec-scope & discovery) — to the
# rqml-claude, rqml-codex and rqml-opencode plugins by opening a refresh PR on each
# whenever either reference changes on main. Implements REQ-CRAFT-SYNC (see ADR-0009).
#
# Each target declares its own vendored destination: the Claude and Codex plugins
# carry the references as a skill directory, opencode as plain instruction files.
# A new plugin must be added to the matrix below with its own `dest`, or upstream
# craft changes will silently never reach it.
#
# PREREQUISITE: a repository secret CRAFT_SYNC_TOKEN — a PAT or GitHub App token
# with contents:write + pull-requests:write on every repository in the matrix
# (rqml-org/rqml-claude, rqml-org/rqml-codex, rqml-org/rqml-opencode). Until it is
# set, this workflow no-ops with a warning; if it is set but lacks access to one
# target, only that target's job fails (fail-fast is off).

on:
  push:
    branches: [main]
    paths: ['references/authoring.md', 'references/monorepo.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rqml-claude
            dest: skills/rqml-authoring
          - target: rqml-codex
            dest: skills/rqml-authoring
          - target: rqml-opencode
            dest: craft
    steps:
      - id: guard
        name: Require sync token
        run: |
          if [ -n "${{ secrets.CRAFT_SYNC_TOKEN }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CRAFT_SYNC_TOKEN not set — skipping craft sync. Provision an rqml-org PAT/App secret with PR access to the plugin repos to enable it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source (rqml-skill)
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Checkout ${{ matrix.target }}
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: rqml-org/${{ matrix.target }}
          token: ${{ secrets.CRAFT_SYNC_TOKEN }}
          path: target

      - name: Vendor references and open PR
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.CRAFT_SYNC_TOKEN }}
          # Where this target vendors the references — see the matrix above.
          DEST: ${{ matrix.dest }}
        run: |
          set -euo pipefail
          mkdir -p "target/$DEST"
          for f in authoring.md monorepo.md; do
            cp "references/$f" "target/$DEST/$f"
          done
          cd target
          git add "$DEST/authoring.md" "$DEST/monorepo.md"
          # Stage first, then compare the index to HEAD: this detects brand-new
          # (untracked) vendored files as well as modified ones. `git diff --quiet`
          # alone ignores untracked files and would skip the initial bootstrap.
          if git diff --cached --quiet; then
            echo "${{ matrix.target }} already up to date — nothing to sync."
            exit 0
          fi

          # Re-pin the drift baseline for the files we just replaced. The target's
          # spec links its vendored copy with an implements edge, so a sync that
          # only copies the file lands a changed-implementation error on the
          # target's main — a sanctioned change reported as drift, on every sync.
          #
          # Scoped deliberately to the two paths this job wrote: refreshing every
          # drifted edge would launder unrelated drift, and a baseline re-pinned
          # without reading is worse than a red gate.
          # `check` exits 2 when it finds drift — which is the case we are here to
          # handle — so its status must not abort the job under `set -e`.
          drift_json="$(npx -y @rqml/cli check --json 2>/dev/null || true)"
          edges="$(printf '%s' "$drift_json" | jq -r --arg dest "$DEST" '
            .drift[]? | select(.uri | endswith($dest + "/authoring.md")
                            or endswith($dest + "/monorepo.md")) | .edgeId' 2>/dev/null || true)"
          refreshed=""
          for edge in $edges; do
            npx -y @rqml/cli link --refresh "$edge"
            refreshed="${refreshed} \`${edge}\`"
          done
          if [ -n "$refreshed" ]; then
            git add .rqml
            echo "re-pinned:${refreshed}"
          fi

          ver() { grep -oE 'canonical-version: [0-9]+' "../references/$1" | head -1 | grep -oE '[0-9]+'; }
          # Key the branch on the combined content of both references, not the
          # human-bumped versions, so each distinct revision gets its own branch/PR
          # and a force-push can never clobber an unrelated revision.
          hash="$(cat ../references/authoring.md ../references/monorepo.md | sha256sum | cut -c1-12)"
          branch="craft-sync/refs-${hash}"
          git config user.name "rqml craft-sync"
          git config user.email "noreply@rqml.org"
          git checkout -b "$branch"
          git commit -m "chore: sync RQML reference docs from rqml-skill (${hash})"
          git push -f origin "$branch"
          title="Sync RQML reference docs"
          body="Automated sync of the canonical RQML references from [rqml-org/rqml-skill](https://github.com/rqml-org/rqml-skill): \`authoring.md\` (canonical-version $(ver authoring.md)) and \`monorepo.md\` (canonical-version $(ver monorepo.md)) — content ${hash}. Do not edit the vendored copies directly — change them upstream in rqml-skill and let craft-sync propagate."
          if [ -n "$refreshed" ]; then
            # Keep the continuation lines indented to the block scalar: a line at
            # column 0 terminates the `run: |` block and makes the whole workflow
            # unparseable. YAML strips this indentation back off, so the bash
            # string still gets the paragraph break at column 0.
            body="${body}

          Drift baselines re-pinned for the synced files:${refreshed}. The vendored copies are byte-identical to the canonical references, so \`rqml check\` should pass on this branch — read the diff, not just the verdict."
          fi
          # Explicit existence check so a genuine create failure is not masked as
          # "already exists", and so an update refreshes both title and body.
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body" >/dev/null
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
